<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ObligeU - Virtual Help</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                height: 100vh; display: flex; flex-direction: column;
                background: #0B1D51; color: #fff;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            header { padding: 16px 22px; font-size: 14px; font-weight: 700; letter-spacing: .5px; }
            #status { padding: 0 22px 12px; font-size: 13px; color: #c9d3f0; }

            .stage { position: relative; flex: 1; min-height: 0; margin: 0 22px; }
            #remoteVideo {
                width: 100%; height: 100%; object-fit: cover;
                background: #08143a; border-radius: 18px;
            }
            #localVideo {
                position: absolute; right: 16px; bottom: 16px;
                width: 200px; max-width: 30%; aspect-ratio: 4 / 3; object-fit: cover;
                border-radius: 12px; border: 2px solid rgba(255, 255, 255, .6);
                background: #000; transform: scaleX(-1);   /* mirror, like a mirror */
            }

            .controls { display: flex; justify-content: center; gap: 12px; padding: 18px; }
            .controls button {
                height: 44px; padding: 0 22px; border: none; border-radius: 999px;
                background: rgba(255, 255, 255, .14); color: #fff;
                font-size: 13px; font-weight: 700; cursor: pointer;
            }
            .controls button:hover { background: rgba(255, 255, 255, .24); }
            .controls button.off { background: #e03f4f; }
            .controls #leave { background: #e03f4f; }
        </style>
    </head>
    <body>
        <header>ObligeU · Virtual Help</header>
        <div id="status">Starting...</div>

        <div class="stage">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="controls">
            <button type="button" id="micButton">Mute</button>
            <button type="button" id="camButton">Camera off</button>
            <button type="button" id="leave">Leave</button>
        </div>

        <script src="call.js"></script>
    </body>
</html>
